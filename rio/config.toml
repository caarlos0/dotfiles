# https://rioterm.com/docs/config
confirm-before-quit = false
theme = "catppuccin"
# matches ghostty's macos-option-as-alt = true, needed for tmux's M-hjkl
option-as-alt = "both"

[editor]
program = "vim"
args = []

[effects]
trail-cursor = false

[fonts]
size = 13
family = "Berkeley Mono"
features = ["zero","calt","liga"]
extras = [{family="JetBrainsMono Nerd Font Mono"}]
symbol-map = [
  # powerline & powerline-extras
  {start = "e0b0", end ="e0b3", font-family="JetBrainsMono Nerd Font Mono"},
  {start = "e0b4", end ="e0c8", font-family="JetBrainsMono Nerd Font Mono"},
  {start = "e0cc", end ="e0d4", font-family="JetBrainsMono Nerd Font Mono"},
  {start = "e0ca", end ="e0ca", font-family="JetBrainsMono Nerd Font Mono"},
  # font-awesome & font-awesome-extension
  {start = "ed00", end ="f2ff", font-family="JetBrainsMono Nerd Font Mono"},
  {start = "e200", end ="e2a9", font-family="JetBrainsMono Nerd Font Mono"},
  # seti-ui
  {start = "e5fa", end ="e6b7", font-family="JetBrainsMono Nerd Font Mono"},
  # devicons
  {start = "e700", end ="e8ef", font-family="JetBrainsMono Nerd Font Mono"},
  # codicons
  {start = "ea60", end ="ec1e", font-family="JetBrainsMono Nerd Font Mono"},
  # font-logos
  {start = "f300", end ="f381", font-family="JetBrainsMono Nerd Font Mono"},
  # octicons
  {start = "f400", end ="f533", font-family="JetBrainsMono Nerd Font Mono"},
  # material design icons
  {start = "f0001", end ="f1af0", font-family="JetBrainsMono Nerd Font Mono"},
]

[window]
mode = "Maximized"
decorations = "Enabled"
macos-use-shadow = true
colorspace = "rec2020"

[navigation]
use-split = false

[bindings]
keys = [
  # Ghostty's legacy key encoder sends CSI 27;2;13~ for shift+enter out of the
  # box (see its function_keys.zig table), which tmux resolves to S-Enter. Rio
  # only disambiguates shift+enter when the app turns on the kitty keyboard
  # protocol, and tmux never asks for it, so without this it sends a bare \r
  # and shift+enter is indistinguishable from enter. Send ghostty's exact
  # sequence to keep the two emulators behavior-equivalent.
  { key = "enter", with = "shift", esc = "\u001b[27;2;13~" },
  { key = "p", with = "super", esc = "\u0002p" },
  { key = "t", with = "super", esc = "\u0002c" },
  { key = "w", with = "super", esc = "\u0002x" },
  { key = "d", with = "super", esc = "\u0002i" },
  { key = "1", with = "super", esc = "\u00021" },
  { key = "2", with = "super", esc = "\u00022" },
  { key = "3", with = "super", esc = "\u00023" },
  { key = "4", with = "super", esc = "\u00024" },
  { key = "5", with = "super", esc = "\u00025" },
  { key = "6", with = "super", esc = "\u00026" },
  { key = "7", with = "super", esc = "\u00027" },
  { key = "8", with = "super", esc = "\u00028" },
  { key = "9", with = "super", esc = "\u00029" },
  { key = "d", with = "shift | super", esc = "\u0002u" },
  { key = "tab", with = "control", esc = "\u0002n" },
  { key = "tab", with = "shift | control", esc = "\u0002p" },
]
