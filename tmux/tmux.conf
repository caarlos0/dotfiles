set -g default-terminal "tmux-256color"
setenv -g COLORTERM "truecolor"

set -s escape-time 0
setw -g mouse on
set -g status-keys emacs
set -g focus-events on
# Temporarily reduced from 100000: smaller scrollback lowers the frequency of
# the copy-mode double-free crash (grid_free_line via window_copy_clone_screen)
# on macOS/Apple Silicon tmux 3.7 — upstream tmux/tmux#5267 and #5302.
# Restore to 100000 once that's fixed upstream.
set -g history-limit 20000
set -g display-time 10000
set -g allow-passthrough on

# Tell tmux what the outer terminals support, so it forwards OSC 8 hyperlinks
# instead of stripping them (makes clickable links work inside tmux), plus
# truecolor and styled/coloured underlines.
set -as terminal-features "xterm-ghostty:RGB:hyperlinks:usstyle"
set -as terminal-features "rio:RGB:hyperlinks:usstyle"

# Hack to make Shift-Enter and Ctrl-m work in tmux
# Stolen from https://github.com/listx/syscfg/blob/master/tmux/.tmux.conf
bind-key -T root         S-Enter     send-keys Escape "[13;2u"
bind-key -T root         C-m         send-keys Escape "[109;5u"

# fix SSH agent after reconnecting
# https://blog.testdouble.com/posts/2016-11-18-reconciling-tmux-and-ssh-agent-forwarding/
# SSH_AUTH_SOCK is included because macOS rotates the launchd agent socket
# (/var/run/com.apple.launchd.*/Listeners) on every login, so a long-lived tmux
# server otherwise keeps handing new panes a dead socket. This refreshes it on
# attach; panes started before the attach keep the old value.
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_AUTH_SOCK SSH_CONNECTION WINDOWID XAUTHORITY"

# Start windows and panes index at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Ensure window index numbers get reordered on delete.
set-option -g renumber-windows on

# set terminal title
set-option -g set-titles on
set-option -g set-titles-string "#S / #W"

# auto rename tmux window to current cwd
set-option -g status-interval 3
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{pane_title}'

# blinking cursor
set-option -g cursor-style blinking-block

# tab bar
set-option -g status-position top

# vim-mode copy/paste
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# open splits and windows in the current folder
bind u split-window -l 25% -v -c "#{pane_current_path}"
bind i split-window -l 50% -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-like pane resizing
bind-key -r K resize-pane -U 5
bind-key -r J resize-pane -D 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5

# repeatable layout cycling (even-horizontal <-> even-vertical)
bind-key -r Space if-shell -F "#{@even_h}" \
  "select-layout even-vertical;  set -w @even_h ''" \
  "select-layout even-horizontal; set -w @even_h 1"

# other keys
bind-key R source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind-key p run-shell "tmux-sessionizer"
bind-key e run-shell "tmux-gh-dash"
bind-key g switch-client -l
# Kill the pane directly when it's just the default shell; if it's running
# anything else (vim, ssh, a build, …), confirm first so we don't lose work.
bind-key x if-shell -F '#{==:#{pane_current_command},#{b:default-shell}}' \
  'kill-pane' \
  'confirm-before -p "kill pane running #{pane_current_command}? (y/n)" kill-pane'

# Smart pane switching with awareness of Vim splits.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'
bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R

# unbind conflicts
unbind C-z

set-option -g repeat-time 1000
set -g set-clipboard on

set -g status "on"
set -g status-justify "centre"
set -g status-left-length "0"
set -g status-right-length "0"
set -g status-left ""
set -g status-right ""
set -g status-left-style NONE
set -g status-right-style NONE


# Catppuccin Mocha (OLED) — match ghostty/rio/nvim
set -g message-style "fg=#89b4fa,bg=#000000"
set -g message-command-style "fg=#89b4fa,bg=#000000"
set -g pane-border-style "fg=#000000"
set -g pane-active-border-style "fg=#89b4fa"
setw -g window-status-activity-style "underscore,fg=#a6adc8,bg=#000000"
setw -g window-status-separator "#[fg=#585b70]│"
setw -g window-status-style "NONE,fg=#a6adc8,bg=#000000"
set -g mode-style "fg=#cdd6f4,bg=#585b70"
set -g copy-mode-match-style "fg=#cdd6f4,bg=#585b70"
set -g copy-mode-current-match-style "fg=#11111b,bg=#89b4fa"
set -g status-style "fg=#89b4fa,bg=#000000"
setw -g window-status-activity-style "underscore,fg=#a6adc8,bg=#000000"
set -g status-right-style "fg=#89b4fa,bg=#000000,nobold,nounderscore,noitalics"
setw -g window-status-bell-style "NONE,fg=#a6adc8,bg=#000000"
setw -g window-status-current-format "#[fg=#11111b,bg=#89b4fa,bold] #I #{?window_bell_flag,#[fg=#f38ba8],#(tmux-window-icon --no-ci #{pane_current_path} #{pane_current_command})} #[fg=#11111b,bg=#89b4fa,bold,nounderscore,noitalics]#{b:pane_current_path} "
setw -g window-status-format         "#[fg=#a6adc8,bg=#000000,bold] #I #{?window_bell_flag,#[fg=#f38ba8],#(tmux-window-icon #{pane_current_path} #{pane_current_command})} #[fg=#a6adc8,nobold,nounderscore,italics]#{b:pane_current_path} "

set -gu default-command
set -g default-shell "$SHELL"
